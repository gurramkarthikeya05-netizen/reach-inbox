services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /health/live
    buildCommand: >-
      mkdir -p /tmp/corepack-bin &&
      corepack enable --install-directory /tmp/corepack-bin &&
      export PATH="/tmp/corepack-bin:$PATH" &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @reachinbox/api db:generate &&
      pnpm --filter @reachinbox/api... build &&
      pnpm --filter @reachinbox/api exec prisma migrate deploy
    startCommand: node apps/api/dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: MIN_SEND_INTERVAL_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: MAX_RECIPIENTS_PER_CAMPAIGN
        value: "5000"
      # Set in the dashboard. Never commit these values.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SMTP_SENDERS_JSON
        sync: false

  - type: web
    name: reachinbox-web
    runtime: static
    buildCommand: >-
      mkdir -p /tmp/corepack-bin &&
      corepack enable --install-directory /tmp/corepack-bin &&
      export PATH="/tmp/corepack-bin:$PATH" &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @reachinbox/web... build
    staticPublishPath: apps/web/dist
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
